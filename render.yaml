services:
  - type: web
    name: ccptpm-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: edulearn
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: 86400000
      - key: PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES
        value: 30
      - key: PASSWORD_RESET_DEBUG_RETURN_TOKEN
        value: false
      - key: UPLOAD_MAX_FILE_SIZE_BYTES
        value: 5242880
      - key: APP_PROFILE
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://ccptpm-frontend.onrender.com
      - key: CORS_ALLOWED_METHODS
        value: GET,POST,PUT,PATCH,DELETE,OPTIONS
      - key: CORS_ALLOWED_HEADERS
        value: Content-Type,Authorization
      - key: CORS_ALLOW_CREDENTIALS
        value: true

  - type: static_site
    name: ccptpm-frontend
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    publishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: VITE_API_BASE_URL
        value: https://ccptpm-api.onrender.com
