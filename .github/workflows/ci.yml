name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      VITE_API_BASE_URL: http://127.0.0.1:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CI: true
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      APP_PROFILE: ci
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: edulearn_ci
      JWT_SECRET: ci-placeholder-secret-with-at-least-32-characters
      JWT_EXPIRATION: 86400000
      PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES: 30
      PASSWORD_RESET_DEBUG_RETURN_TOKEN: false
      UPLOAD_MAX_FILE_SIZE_BYTES: 5242880
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CORS_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      CORS_ALLOWED_HEADERS: "*"
      CORS_ALLOW_CREDENTIALS: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
